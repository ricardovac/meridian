<mat-sidenav-container class="shell">
  <mat-sidenav class="shell__sidenav" mode="side" opened>
    <div class="shell__brand">
      <mat-icon>account_balance</mat-icon>
      <span>Meridian</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="shell__link--active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/transfer" routerLinkActive="shell__link--active">
        <mat-icon matListItemIcon>swap_horiz</mat-icon>
        <span matListItemTitle>Nova transferência</span>
      </a>
      <button mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Sair</span>
      </button>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__body">
    <mat-toolbar class="shell__toolbar">
      <span class="shell__spacer"></span>
      @if (userEmail(); as email) {
        <span class="shell__user">
          <mat-icon>person</mat-icon>
          {{ email }}
        </span>
      }
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
